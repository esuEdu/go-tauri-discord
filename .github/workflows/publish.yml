name: publish

on:
  push:
    branches: [developer]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish arm64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/vocalis:latest
            ghcr.io/${{ github.repository_owner }}/vocalis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to run on the host
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/vocalis:latest"
          echo "On the deployment host: make deploy-pull"
