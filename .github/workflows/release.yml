name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and attach the installers to
        required: true

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal .dmg)
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows (.exe)
            targets: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Which server the installed app talks to. Without this it would ship
          # pointing at localhost and be useless to anybody but the builder.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://147-15-15-86.nip.io' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: client
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Vocalis ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Neither installer is signed, so both operating systems will object
            the first time.

            **macOS** — the app is refused on first launch with "Apple could not
            verify Vocalis is free of malware".

            On macOS 15 and later, right-clicking and choosing Open **no longer
            works** — Apple removed that bypass. Instead: open it once and
            dismiss the warning, then go to **System Settings → Privacy &
            Security**, scroll to **Security**, and click **Open Anyway** next to
            the line about Vocalis. Only needed once per install.

            In a terminal instead, if you prefer:
            `xattr -dr com.apple.quarantine /Applications/Vocalis.app`

            Screen sharing and the microphone ask for permission separately, and
            because the app is unsigned macOS does not remember the answers
            between versions — you will be asked again after each update. Remove
            the old entry under Privacy & Security before granting it again, or
            the stale one sits there doing nothing.

            **Windows** — SmartScreen shows a blue box. Click *More info*, then
            *Run anyway*.

            All of this goes away with signing, which needs a paid certificate
            from Apple and from a Windows CA.
