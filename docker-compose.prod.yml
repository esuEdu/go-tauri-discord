name: vocalis

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?unset - run make deploy-env}
      POSTGRES_DB: vocalis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vocalis -d vocalis"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
    image: ${VOCALIS_IMAGE:-vocalis:latest}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - vocalis-files:/var/lib/vocalis
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?unset - set it in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  vocalis-files:
  caddy-data:
  caddy-config:
